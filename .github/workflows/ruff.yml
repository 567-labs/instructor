name: Ruff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WORKING_DIRECTORY: "."
  CUSTOM_PACKAGES: "instructor examples tests"

jobs:
  Ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.10"
          cache-suffix: lint-tools-py310
      - name: Set up Python
        run: uv python install 3.10
      - name: Ruff lint
        run: uv run --frozen --only-group lint ruff check ${{ env.CUSTOM_PACKAGES }}
      - name: Ruff format
        run: uv run --frozen --only-group lint ruff format --check ${{ env.CUSTOM_PACKAGES }}
