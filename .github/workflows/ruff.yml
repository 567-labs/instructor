name: Ruff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WORKING_DIRECTORY: "."
  CUSTOM_PACKAGES: "instructor examples tests scripts/ci_test_plan.py scripts/run_unit_tests.py scripts/ci_worker_coverage.py scripts/check_statement_coverage.py"

jobs:
  Ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select changed inputs
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python -m scripts.ci_test_plan --changed-paths
          instructor examples tests scripts/ci_test_plan.py scripts/run_unit_tests.py scripts/ci_worker_coverage.py scripts/check_statement_coverage.py pyproject.toml uv.lock .pre-commit-config.yaml .github/workflows/ruff.yml
      - name: Install uv
        if: steps.scope.outputs.changed == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          enable-cache: true
          python-version: "3.10"
          cache-suffix: lint-tools-py310
      - name: Set up Python
        if: steps.scope.outputs.changed == 'true'
        run: uv python install 3.10
      - name: Check lint and formatting
        if: steps.scope.outputs.changed == 'true'
        run: |
          read -r -a packages <<< "$CUSTOM_PACKAGES"
          uv run --frozen --only-group lint ruff check "${packages[@]}"
          uv run --frozen --only-group lint ruff format --check "${packages[@]}"
