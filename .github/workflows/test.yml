name: Test
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core Tests
            shard: core
            path: tests
            pytest-options: >-
              --ignore=tests/v2 --ignore=tests/coverage
              --ignore=tests/test_batch_processor_coverage.py
          - name: V2 Tests
            shard: v2
            path: tests/v2
            pytest-options: --ignore=tests/v2/decisions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        uses: ./.github/actions/setup-test-environment
      - name: Run offline tests with branch coverage
        env:
          INSTRUCTOR_ENV: CI
          TEST_PATH: ${{ matrix.path }}
          PYTEST_ADDOPTS: ${{ matrix.pytest-options }}
          COVERAGE_FILE: ${{ runner.temp }}/coverage.${{ matrix.shard }}
        run: >-
          uv run --frozen coverage run --branch -m pytest "$TEST_PATH"
          --asyncio-mode=auto --strict-config --strict-markers
          -m 'not llm' -k 'not docs'
      - name: Upload shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-coverage-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage.${{ matrix.shard }}
          if-no-files-found: error
          overwrite: true

  # Offline coverage tests must not be filtered by provider names.
  offline-coverage-tests:
    name: Offline Coverage Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      INSTRUCTOR_ENV: CI
      PYTHONWARNINGS: error::ResourceWarning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: offline-py${{ matrix.python-version }}
      - name: Run focused coverage tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          COVERAGE_FILE: ${{ runner.temp }}/coverage.focused
        run: |
          coverage_args=()
          if [[ "$PYTHON_VERSION" == "3.11" ]]; then
            coverage_args+=(--branch)
          fi
          uv run --frozen coverage run "${coverage_args[@]}" -m pytest \
            tests/coverage tests/test_batch_processor_coverage.py tests/v2/decisions \
            --asyncio-mode=auto --strict-config --strict-markers \
            -W error::pytest.PytestUnraisableExceptionWarning \
            -W error::pytest.PytestUnhandledThreadExceptionWarning
          uv run --frozen coverage report --show-missing
          uv run --frozen coverage json -o "$RUNNER_TEMP/focused-coverage.json"
          uv run --frozen python scripts/check_statement_coverage.py "$RUNNER_TEMP/focused-coverage.json" 90
      - name: Upload Python 3.11 focused coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-coverage-${{ github.run_id }}-focused
          path: ${{ runner.temp }}/coverage.focused
          if-no-files-found: error
          overwrite: true

  # Enforce repository-wide statement and branch coverage without provider secrets.
  full-coverage:
    name: Full Coverage (Python 3.11)
    needs: [core-tests, offline-coverage-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Set up Python
        run: uv python install 3.11
      - name: Download coverage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: offline-coverage-${{ github.run_id }}-*
          path: ${{ runner.temp }}/coverage-parts
      - name: Verify full offline coverage
        run: |
          parts="$RUNNER_TEMP/coverage-parts"
          prefix="offline-coverage-$GITHUB_RUN_ID"
          uv run --frozen --only-group coverage coverage combine \
            "$parts/$prefix-core/coverage.core" \
            "$parts/$prefix-v2/coverage.v2" \
            "$parts/$prefix-focused/coverage.focused"
          uv run --frozen --only-group coverage coverage report --show-missing --fail-under=99
          uv run --frozen --only-group coverage coverage json -o "$RUNNER_TEMP/coverage.json"
          uv run --frozen --only-group coverage python scripts/check_statement_coverage.py "$RUNNER_TEMP/coverage.json" 100

  # Core provider tests for OpenAI
  core-openai:
    name: Core Provider Tests (OpenAI)
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      PROVIDER_TEST_REQUIREMENTS: OPENAI_API_KEY
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        if: ${{ env.HAS_OPENAI_API_KEY == 'true' }}
        uses: ./.github/actions/setup-test-environment
      - name: Skip core provider tests (OpenAI)
        if: ${{ env.HAS_OPENAI_API_KEY != 'true' }}
        run: echo "Skipping OpenAI core provider tests (missing OPENAI_API_KEY)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run core provider tests (OpenAI)
        if: ${{ env.HAS_OPENAI_API_KEY == 'true' }}
        run: bash scripts/run_provider_tests.sh tests/llm/test_core_providers -v -k "openai"
        env:
          INSTRUCTOR_ENV: CI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Summarize provider test evidence
        if: always()
        run: python scripts/provider_test_evidence.py --reports "${RUNNER_TEMP}"

  # Core provider tests for Anthropic
  core-anthropic:
    name: Core Provider Tests (Anthropic)
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      PROVIDER_TEST_REQUIREMENTS: ANTHROPIC_API_KEY
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' }}
        uses: ./.github/actions/setup-test-environment
      - name: Skip core provider tests (Anthropic)
        if: ${{ env.HAS_ANTHROPIC_API_KEY != 'true' }}
        run: echo "Skipping Anthropic core provider tests (missing ANTHROPIC_API_KEY)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run core provider tests (Anthropic)
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' }}
        run: bash scripts/run_provider_tests.sh tests/llm/test_core_providers -v -k "anthropic"
        env:
          INSTRUCTOR_ENV: CI
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Summarize provider test evidence
        if: always()
        run: python scripts/provider_test_evidence.py --reports "${RUNNER_TEMP}"

  # Core provider tests for Google
  core-google:
    name: Core Provider Tests (Google)
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      PROVIDER_TEST_REQUIREMENTS: GOOGLE_API_KEY GOOGLE_GENAI_MODEL
      HAS_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
      HAS_GOOGLE_GENAI_MODEL: ${{ secrets.GOOGLE_GENAI_MODEL != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        if: ${{ env.HAS_GOOGLE_API_KEY == 'true' && env.HAS_GOOGLE_GENAI_MODEL == 'true' }}
        uses: ./.github/actions/setup-test-environment
      - name: Skip core provider tests (Google)
        if: ${{ env.HAS_GOOGLE_API_KEY != 'true' || env.HAS_GOOGLE_GENAI_MODEL != 'true' }}
        run: echo "Skipping Google core provider tests (missing GOOGLE_API_KEY or GOOGLE_GENAI_MODEL)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run core provider tests (Google)
        if: ${{ env.HAS_GOOGLE_API_KEY == 'true' && env.HAS_GOOGLE_GENAI_MODEL == 'true' }}
        run: bash scripts/run_provider_tests.sh tests/llm/test_core_providers -v -k "google"
        env:
          INSTRUCTOR_ENV: CI
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_MODEL: ${{ secrets.GOOGLE_GENAI_MODEL }}

      - name: Summarize provider test evidence
        if: always()
        run: python scripts/provider_test_evidence.py --reports "${RUNNER_TEMP}"

  # Core provider tests for other providers
  core-other:
    name: Core Provider Tests (Other)
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      PROVIDER_TEST_REQUIREMENTS: COHERE_API_KEY XAI_API_KEY MISTRAL_API_KEY CEREBRAS_API_KEY FIREWORKS_API_KEY WRITER_API_KEY PERPLEXITY_API_KEY
      HAS_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY != '' }}
      HAS_XAI_API_KEY: ${{ secrets.XAI_API_KEY != '' }}
      HAS_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY != '' }}
      HAS_CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY != '' }}
      HAS_FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY != '' }}
      HAS_WRITER_API_KEY: ${{ secrets.WRITER_API_KEY != '' }}
      HAS_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        uses: ./.github/actions/setup-test-environment
      - name: Skip core provider tests (Other)
        if: >-
          ${{ env.HAS_COHERE_API_KEY != 'true' && env.HAS_XAI_API_KEY != 'true'
          && env.HAS_MISTRAL_API_KEY != 'true' && env.HAS_CEREBRAS_API_KEY != 'true'
          && env.HAS_FIREWORKS_API_KEY != 'true' && env.HAS_WRITER_API_KEY != 'true'
          && env.HAS_PERPLEXITY_API_KEY != 'true' }}
        run: echo "Skipping core provider tests (Other) (missing provider secrets)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run core provider tests (Cohere, xAI, Mistral, etc)
        if: >-
          ${{ env.HAS_COHERE_API_KEY == 'true' || env.HAS_XAI_API_KEY == 'true'
          || env.HAS_MISTRAL_API_KEY == 'true' || env.HAS_CEREBRAS_API_KEY == 'true'
          || env.HAS_FIREWORKS_API_KEY == 'true' || env.HAS_WRITER_API_KEY == 'true'
          || env.HAS_PERPLEXITY_API_KEY == 'true' }}
        run: bash scripts/run_provider_tests.sh --retry-failures tests/llm/test_core_providers -v -k "cohere or xai or mistral or cerebras or fireworks or writer or perplexity"
        env:
          INSTRUCTOR_ENV: CI
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          WRITER_API_KEY: ${{ secrets.WRITER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Check current documented model IDs
        run: uv run --frozen pytest tests/llm/test_current_doc_models.py -v -rs --asyncio-mode=auto --junitxml="${RUNNER_TEMP}/provider-evidence-documented-models.xml"
        env:
          INSTRUCTOR_ENV: CI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}

      - name: Summarize provider test evidence
        if: always()
        run: python scripts/provider_test_evidence.py --reports "${RUNNER_TEMP}"

  # Provider tests run in parallel
  provider-tests:
    name: ${{ matrix.provider.name }} Tests
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      PROVIDER_TEST_REQUIREMENTS: PROVIDER_API_KEY
      HAS_PROVIDER_API_KEY: >-
        ${{ (matrix.provider.env_key == 'OPENAI_API_KEY' && secrets.OPENAI_API_KEY != '') ||
        (matrix.provider.env_key == 'ANTHROPIC_API_KEY' && secrets.ANTHROPIC_API_KEY != '') ||
        (matrix.provider.env_key == 'GOOGLE_API_KEY' && secrets.GOOGLE_API_KEY != '') ||
        (matrix.provider.env_key == 'WRITER_API_KEY' && secrets.WRITER_API_KEY != '') }}
      PROVIDER_NAME: ${{ matrix.provider.name }}
      PROVIDER_ENV_KEY: ${{ matrix.provider.env_key }}
      PROVIDER_TEST_PATH: ${{ matrix.provider.test_path }}
      HAS_GOOGLE_GENAI_MODEL: ${{ secrets.GOOGLE_GENAI_MODEL != '' }}
    strategy:
      fail-fast: false
      matrix:
        provider:
          - name: OpenAI
            env_key: OPENAI_API_KEY
            test_path: tests/llm/test_openai
          - name: Anthropic
            env_key: ANTHROPIC_API_KEY
            test_path: tests/llm/test_anthropic
          - name: Gemini
            env_key: GOOGLE_API_KEY
            test_path: tests/llm/test_gemini
          - name: Google GenAI
            env_key: GOOGLE_API_KEY
            test_path: tests/llm/test_genai
          - name: Vertex AI
            env_key: GOOGLE_API_KEY
            test_path: tests/llm/test_vertexai
          - name: Writer
            env_key: WRITER_API_KEY
            test_path: tests/llm/test_writer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        if: ${{ env.HAS_PROVIDER_API_KEY == 'true' && ((matrix.provider.name != 'Gemini' && matrix.provider.name != 'Google GenAI' && matrix.provider.name != 'Vertex AI') || env.HAS_GOOGLE_GENAI_MODEL == 'true') }}
        uses: ./.github/actions/setup-test-environment
        with:
          cache-suffix: provider-${{ matrix.provider.name }}-py311
      - name: Skip ${{ matrix.provider.name }} tests
        if: >-
          ${{ env.HAS_PROVIDER_API_KEY != 'true' ||
          ((matrix.provider.name == 'Gemini' || matrix.provider.name == 'Google GenAI'
          || matrix.provider.name == 'Vertex AI') && env.HAS_GOOGLE_GENAI_MODEL != 'true') }}
        run: >-
          echo "Skipping $PROVIDER_NAME tests
          (missing $PROVIDER_ENV_KEY or GOOGLE_GENAI_MODEL)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run ${{ matrix.provider.name }} tests
        if: >-
          ${{ env.HAS_PROVIDER_API_KEY == 'true' &&
          ((matrix.provider.name != 'Gemini' && matrix.provider.name != 'Google GenAI'
          && matrix.provider.name != 'Vertex AI') || env.HAS_GOOGLE_GENAI_MODEL == 'true') }}
        run: bash scripts/run_provider_tests.sh "$PROVIDER_TEST_PATH"
        env:
          INSTRUCTOR_ENV: CI
          OPENAI_API_KEY: ${{ matrix.provider.env_key == 'OPENAI_API_KEY' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider.env_key == 'ANTHROPIC_API_KEY' && secrets.ANTHROPIC_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ matrix.provider.env_key == 'GOOGLE_API_KEY' && secrets.GOOGLE_API_KEY || '' }}
          WRITER_API_KEY: ${{ matrix.provider.env_key == 'WRITER_API_KEY' && secrets.WRITER_API_KEY || '' }}
          GOOGLE_GENAI_MODEL: ${{ matrix.provider.env_key == 'GOOGLE_API_KEY' && secrets.GOOGLE_GENAI_MODEL || '' }}

      - name: Summarize provider test evidence
        if: always()
        run: python scripts/provider_test_evidence.py --reports "${RUNNER_TEMP}"

  # Auto client needs multiple providers
  auto-client-test:
    name: Auto Client Tests
    runs-on: ubuntu-latest
    needs: core-tests
    env:
      PROVIDER_TEST_REQUIREMENTS: OPENAI_API_KEY GOOGLE_API_KEY COHERE_API_KEY ANTHROPIC_API_KEY XAI_API_KEY
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
      HAS_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_XAI_API_KEY: ${{ secrets.XAI_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        if: ${{ env.HAS_OPENAI_API_KEY == 'true' && env.HAS_GOOGLE_API_KEY == 'true' && env.HAS_COHERE_API_KEY == 'true' && env.HAS_ANTHROPIC_API_KEY == 'true' && env.HAS_XAI_API_KEY == 'true' }}
        uses: ./.github/actions/setup-test-environment
      - name: Skip Auto Client tests
        if: >-
          ${{ env.HAS_OPENAI_API_KEY != 'true' || env.HAS_GOOGLE_API_KEY != 'true'
          || env.HAS_COHERE_API_KEY != 'true' || env.HAS_ANTHROPIC_API_KEY != 'true'
          || env.HAS_XAI_API_KEY != 'true' }}
        run: echo "Skipping Auto Client tests (missing one or more provider secrets)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Auto Client tests
        if: >-
          ${{ env.HAS_OPENAI_API_KEY == 'true' && env.HAS_GOOGLE_API_KEY == 'true'
          && env.HAS_COHERE_API_KEY == 'true' && env.HAS_ANTHROPIC_API_KEY == 'true'
          && env.HAS_XAI_API_KEY == 'true' }}
        run: bash scripts/run_provider_tests.sh --retry-failures tests/providers/test_auto_client.py -m llm
        env:
          INSTRUCTOR_ENV: CI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

      - name: Summarize provider test evidence
        if: always()
        run: python scripts/provider_test_evidence.py --reports "${RUNNER_TEMP}"
