name: Secret scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan incoming commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # Treat the PR as Git data only. Never check out or execute its files.
          repo="$RUNNER_TEMP/scan.git"
          git init --bare --quiet "$repo"
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$repo" fetch --quiet --no-tags "$remote" "$HEAD_SHA"
          range="$HEAD_SHA"
          if [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git -C "$repo" fetch --quiet --no-tags "$remote" "$BASE_SHA"
            range="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --ignore-gitleaks-allow --no-banner --log-opts="-m $range" "$repo"
