[project]
authors = [
    { name = "Jason Liu" },
    { name = "Ivan Leo" },
]
maintainers = [
    { name = "Jason Liu" },
    { email = "ivan@jxnl.co" },
]
license = { text = "MIT" }
requires-python = "<4.0,>=3.10"
dependencies = [
    "openai>=3.55.1,<4.0.0",
    "httpx>=0.23.0,<1.0.0",
    "pydantic>=2.14.4,<3.0.0",
    "docstring-parser<1.0,>=0.16",
    "typer>=0.29.1,<1.0.0",
    "rich>=13.7.0,<16.0.0",
    "aiohttp<4.0.0,>=3.14.5",
    "tenacity<10.0.0,>=8.2.3",
    "tqdm>=4.27.0,<5.0.0",
    "pydantic-core>=2.50.5,<3.0.0",
    "jiter>=0.6.1,<0.19",
    "jinja2<4.0.0,>=3.1.4",
    "requests<3.0.0,>=2.34.2",
    "urllib3<3.0.0,>=2.8.0",
    "idna>=3.15",
    "click>=8.5.1",
    "regex>=2023.0.0,<2027.0.0",
]
name = "instructor"
version = "1.18.0"
description = "Extract, validate, and stream structured LLM outputs in Python with Pydantic."
readme = "README.md"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.urls]
repository = "https://github.com/567-labs/instructor"
documentation = "https://python.useinstructor.com/"
changelog = "https://github.com/567-labs/instructor/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (may require API keys)",
    "llm: marks tests that make LLM API calls",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.5.0,<2.0.0",
    "coverage>=7.16.2,<8.0.0",
    "jsonref<2.0.0,>=1.1.0",
    "pytest-examples>=0.0.18",
    "python-dotenv>=1.2.4",
    "pytest-xdist>=3.8.0",
    "ty==0.0.107",
    "anthropic==2.11.0",
    "xmltodict>=1.0.4,<1.1",
]
docs = [
    "mkdocs<2.0.0,>=1.6.1",
    "mkdocs-material[imaging]>=9.7.7,<10.0.0",
    "mkdocstrings>=1.0.6,<1.1.0",
    "mkdocstrings-python>=2.0.9,<3.0.0",
    "pytest-examples>=0.0.18",
    "mkdocs-minify-plugin<1.0.0,>=0.8.0",
    "mkdocs-redirects>=1.2.3,<2.0.0",
    "mkdocs-llmstxt>=0.5.0,<0.6.0",
    "mkdocs-material-extensions>=1.3.1",
]
test-docs = [
    "fastapi>=0.162.5,<0.163.0",
    "redis>=8.1.0,<9.0.0",
    "diskcache<6.0.0,>=5.6.3",
    "pandas>=2.3.3,<3.0.0",
    "tabulate>=0.10.0,<1.0.0",
    "pydantic-extra-types>=2.11.1,<3.0.0",
    "litellm<=1.110.1,>=1.110.1",
    "mistralai>=3.8.0,<4.0.0",
]
anthropic = ["anthropic==2.11.0", "xmltodict>=1.0.4,<1.1"]
groq = ["groq>=1.7.0,<1.8.0"]
cohere = ["cohere>=7.3.2,<8.0.0"]
vertexai = ["google-cloud-aiplatform>=2.10.0,<3.0.0", "jsonref<2.0.0,>=1.1.0"]
cerebras_cloud_sdk = ["cerebras-cloud-sdk>=1.91.0,<2.0.0"]
fireworks-ai = ["fireworks-ai>=1.2.35,<2.0.0"]
writer = ["writer-sdk>=3.0.0,<4.0.0"]
bedrock = ["boto3>=1.44.6,<2.0.0"]
mistral = ["mistralai>=3.8.0,<4.0.0"]
perplexity = ["openai>=3.55.1,<4.0.0"]
google-genai = ["google-genai>=2.33.0","jsonref<2.0.0,>=1.1.0"]
litellm = ["litellm<=1.110.1,>=1.110.1"]
xai = ["xai-sdk>=1.21.0"]
phonenumbers = ["phonenumbers>=9.0.43,<10.0.0"]
graphviz = ["graphviz>=0.21,<1.0.0"]
sqlmodel = ["sqlmodel>=0.0.49,<1.0.0"]
diskcache = ["diskcache<6.0.0,>=5.6.3"]
trafilatura = ["trafilatura>=2.3.1,<3.0.0"]
pydub = ["pydub<1.0.0,>=0.25.1"]
datasets = ["datasets>=5.2.0,<6.0.0"]

[dependency-groups]
coverage = ["coverage"]
lint = ["ruff"]
mutation = ["mutmut==3.8.1"]

[project.scripts]
instructor = "instructor.cli.cli:app"

[tool.mutmut]
source_paths = ["instructor/"]
only_mutate = ["instructor/v2/core/retry.py"]
pytest_add_cli_args_test_selection = [
    "tests/v2/test_retry_runtime.py",
    "tests/v2/test_retry_budget.py",
    "tests/v2/test_retry_isolation_contract.py",
    "tests/v2/test_async_validators_execution.py",
    "tests/coverage/test_core_patch_retry_coverage.py",
]
pytest_add_cli_args = ["--asyncio-mode=auto", "--tb=short"]
max_stack_depth = 12

[tool.hatch.build.targets.sdist]
include = ["/instructor", "/.gitignore", "/LICENSE", "/README.md", "/pyproject.toml"]
